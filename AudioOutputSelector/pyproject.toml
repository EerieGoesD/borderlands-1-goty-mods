[project]
name = "AudioOutputSelector"
version = "1.0.0"
authors = [{ name = "eeriegoesd" }]
description = """Picks which audio device the game plays through, and switches it while the game is running.

For full information about this mod and to report bugs, please visit: https://eeriegoesd.com/gaming/mods/"""

[project.urls]
"Info and bug reports" = "https://eeriegoesd.com/gaming/mods/"

[tool.sdkmod]
name = "Audio Output Selector"
mod_type = "Standard"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = true
download = "https://github.com/EerieGoesD/borderlands-1-goty-mods/raw/refs/heads/main/AudioOutputSelector/AudioOutputSelector.sdkmod"
license = {name = "GPL-3.0-or-later", url = "https://www.gnu.org/licenses/gpl-3.0.en.html" }
