[project]
name = "Continuous Fire"
version = "1.0.0"
authors = [{ name = "eeriegoesd" }]
description = """Guns that fire in bursts keep firing while you hold the trigger.

For full information about this mod and to report bugs, please visit: eeriegoesd.com/gaming/mods"""

[tool.sdkmod]
name = "Continuous Fire"
mod_type = "Standard"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = "True"

download = "https://github.com/EerieGoesD/borderlands-1-goty-mods/raw/refs/heads/main/ContinuousFire/ContinuousFire.sdkmod"
license = {name = "All rights reserved" }
