[project]
name = "Loot Radar"
version = "1.0.0"
authors = [{ name = "eeriegoesd" }]
description = """Marks loot and unopened chests on your compass, so you never walk off leaving something behind.

For full information about this mod and to report bugs, please visit: eeriegoesd.com"""

[tool.sdkmod]
name = "Loot Radar"
mod_type = "Standard"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = "True"
download = "https://github.com/EerieGoesD/borderlands-1-goty-mods/raw/refs/heads/main/LootRadar/LootRadar.sdkmod"
license = {name = "All rights reserved" }
