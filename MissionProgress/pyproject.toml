[project]
name = "MissionProgress"
version = "1.0.0"
authors = [{ name = "eeriegoesd" }]
description = """Shows your mission progress and total game completion, following the Borderlands mission flow.

For full information about this mod and to report bugs, please visit: https://eeriegoesd.com/gaming/mods/"""

[tool.sdkmod]
name = "Mission Progress"
mod_type = "Standard"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = true
download = "https://github.com/EerieGoesD/borderlands-1-goty-mods/raw/refs/heads/main/MissionProgress/MissionProgress.sdkmod"
license = {name = "GPL-3.0-or-later", url = "https://www.gnu.org/licenses/gpl-3.0.en.html" }
