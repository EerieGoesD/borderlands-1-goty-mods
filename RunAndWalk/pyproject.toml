[project]
name = "Run And Walk"
version = "1.0.0"
authors = [{ name = "eeriegoesd" }]
description = """You walk by default. Hold Shift to run, or press Caps Lock to switch for good.

For full information about this mod and how this works, please visit: eeriegoesd.com"""

[tool.sdkmod]
name = "Run And Walk"
mod_type = "Standard"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = "True"
download = "https://github.com/EerieGoesD/borderlands-1-goty-mods/raw/refs/heads/main/RunAndWalk/RunAndWalk.sdkmod"
license = {name = "All rights reserved" }
