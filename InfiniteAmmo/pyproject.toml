[project]
name = "Infinite Ammo"
version = "1.0.0"
authors = [{ name = "eeriegoesd" }]
description = """Firing never uses up your ammo.

For full information about this mod and to report bugs, please visit: https://eeriegoesd.com/gaming/mods/"""

[tool.sdkmod]
name = "Infinite Ammo"
mod_type = "Standard"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = "True"

download = "https://github.com/EerieGoesD/borderlands-1-goty-mods/raw/refs/heads/main/InfiniteAmmo/InfiniteAmmo.sdkmod"
license = {name = "GPL-3.0-or-later", url = "https://www.gnu.org/licenses/gpl-3.0.en.html" }
