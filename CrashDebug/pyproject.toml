[project]
name = "Crash Debug"
version = "1.0.0"
authors = [{ name = "eeriegoesd" }]
description = """Keeps a running note of what every mod is doing, so after a crash you can see which one ran last.

For full information about this mod and to report bugs, please visit: eeriegoesd.com/gaming/mods"""

[tool.sdkmod]
name = "Crash Debug"
mod_type = "Standard"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = "True"
download = "https://github.com/EerieGoesD/borderlands-1-goty-mods/raw/refs/heads/main/CrashDebug/CrashDebug.sdkmod"
license = {name = "All rights reserved" }
