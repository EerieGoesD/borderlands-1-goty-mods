[project]
name = "HideFullPickups"
version = "1.0.1"
authors = [{ name = "eeriegoesd" }]
description = """Stops ammo you cannot carry from lighting up on the ground.

For full information about this mod and to report bugs, please visit: https://eeriegoesd.com/gaming/mods/"""

[project.urls]
"Info and bug reports" = "https://eeriegoesd.com/gaming/mods/"

[tool.sdkmod]
name = "Hide Full Pickups"
mod_type = "Standard"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = true
download = "https://github.com/EerieGoesD/borderlands-1-goty-mods/raw/refs/heads/main/HideFullPickups/HideFullPickups.sdkmod"
license = {name = "GPL-3.0-or-later", url = "https://www.gnu.org/licenses/gpl-3.0.en.html" }
