[project]
name = "Mission Progress"
version = "1.0.0"
authors = [{ name = "eeriegoesd" }]
description = """Shows your overall mission progress and total game completion and where you are in the story, top-right.

For full information about this mod and how this works, please visit: eeriegoesd.com"""

[tool.sdkmod]
name = "Mission Progress"
mod_type = "Standard"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = "True"
download = "https://github.com/EerieGoesD/borderlands-1-goty-mods/raw/refs/heads/main/MissionProgress/MissionProgress.sdkmod"
license = {name = "All rights reserved" }
