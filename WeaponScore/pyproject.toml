[project]
name = "Gear Score"
version = "1.0.0"
authors = [{ name = "eeriegoesd" }]
description = """Rates every weapon by DPS and shield by Shield Power according to in-game formula, on item cards wherever you see it (character skills not counted).

For full information about this mod and to report bugs, please visit: eeriegoesd.com"""

[tool.sdkmod]
name = "Gear Score"
mod_type = "Standard"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = "True"
download = "https://github.com/EerieGoesD/borderlands-1-goty-mods/raw/refs/heads/main/WeaponScore/WeaponScore.sdkmod"
license = {name = "All rights reserved" }
